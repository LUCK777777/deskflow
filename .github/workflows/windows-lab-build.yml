name: Windows lab build

on:
  push:
    branches: [codex/windows-lab-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true
      - id: deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.3
          vcpkg-triplet: x64-windows-release
      - name: Build the test package
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON ${{ steps.deps.outputs.vcpkg-cmake-config }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release -j6 --target package
      - uses: actions/upload-artifact@v7
        with:
          name: deskflow-windows-lab
          path: build/deskflow-*-win-x64-portable.zip
          if-no-files-found: error
          retention-days: 3
